<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parte 2 em Sequência</title>
<style>
  :root { --bg:#05080f; --tx:#e8f4ff; --ciano:#00e0ff; --am:#ffc93c; }
  body { margin:0; background:var(--bg); color:var(--tx); font-family:system-ui,sans-serif; }
  main { max-width:420px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; color:var(--am); margin:4px 0 12px; }
  .tela { position:relative; aspect-ratio:9/16; background:#000; border:1px solid #123; border-radius:8px; overflow:hidden; }
  video { width:100%; height:100%; object-fit:cover; display:block; }
  .cena { position:absolute; top:8px; left:8px; background:#000a; color:var(--ciano); padding:4px 8px; border-radius:4px; font-size:13px; }
  button { margin:12px 0; width:100%; padding:12px; font-size:16px; font-weight:700; background:var(--ciano); color:#001; border:0; border-radius:6px; }
  ol { padding-left:20px; font-size:14px; } a { color:var(--ciano); }
  li.atual { color:var(--am); font-weight:700; }
</style>
</head>
<body>
<main>
  <h1>PRESO NO JOGO · cenas em sequência</h1>
  <div class="tela"><video id="v" playsinline controls></video><div class="cena" id="rot"></div></div>
  <button id="play">▶ Tocar tudo em sequência</button>
  <ol id="lista"></ol>
  <p style="font-size:13px;opacity:.7">Sem som (os clipes vêm mudos). A cena 2, da escolha A/B, ainda não foi gerada. Se um vídeo não carregar, toque no link dele.</p>
</main>
<script>
const cenas = [
  ["1 · Gancho e susto 1", "https://cdn.openart.ai/openart-ai/production/2026-11/create-video/6ZXiRQA7mSyzOsT0bqwf/e42db858-f4aa-4cfc-8a29-e66c96d34834_seed259736821_1793580148882_2f0d898f.mp4"],
  ["3 · Rua vazia e regra 4", "https://cdn.openart.ai/openart-ai/production/2026-11/create-video/6ZXiRQA7mSyzOsT0bqwf/f0fa7302-4e1a-4175-b00d-768a4c49933a_seed1969501805_1793580153198_6ff7844b.mp4"],
  ["4 · Mãe e susto 2", "https://cdn.openart.ai/openart-ai/production/2026-11/create-video/6ZXiRQA7mSyzOsT0bqwf/1f01402c-ef59-42db-a604-dd023a8e70d4_seed1768649848_1793580310236_0d9e36b8.mp4"],
  ["5 · Fuga", "https://cdn.openart.ai/openart-ai/production/2026-11/create-video/6ZXiRQA7mSyzOsT0bqwf/00f11e9c-aa4d-4f81-b978-fc6e7f3dea86_seed1817339422_1793580298514_57c4e40e.mp4"],
  ["6 · Reviravolta e susto 3", "https://cdn.openart.ai/openart-ai/production/2026-11/create-video/6ZXiRQA7mSyzOsT0bqwf/ac9960a1-84e7-4fcc-b653-443a8868f06f_seed1199924563_1793580408861_f6ec4e42.mp4"],
  ["7 · Portão, Max do lado de fora", "https://cdn.openart.ai/openart-ai/production/2026-11/create-video/6ZXiRQA7mSyzOsT0bqwf/6eee7218-384f-4ed8-b0c9-880d57071577_seed2050357613_1793580397952_355415b1.mp4"],
];
const v = document.getElementById('v'), rot = document.getElementById('rot'), lista = document.getElementById('lista');
let i = 0;
cenas.forEach(([n, u], k) => {
  const li = document.createElement('li');
  li.innerHTML = `<a href="${u}" target="_blank" rel="noopener">${n}</a>`;
  li.addEventListener('click', (e) => { if (!e.metaKey) { e.preventDefault(); tocar(k); } });
  lista.appendChild(li);
});
function tocar(k) {
  i = k; v.src = cenas[k][1]; rot.textContent = cenas[k][0];
  [...lista.children].forEach((li, j) => li.classList.toggle('atual', j === k));
  v.play().catch(() => {});
}
v.addEventListener('ended', () => { if (i < cenas.length - 1) tocar(i + 1); });
document.getElementById('play').onclick = () => tocar(0);
tocar(0); v.pause();
</script>
</body>
</html>
